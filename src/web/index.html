<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tview</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #121418;
      --panel: #1a1d24;
      --elevated: #222630;
      --border: #303644;
      --text: #e8ecf2;
      --muted: #949cac;
      --dim: #646c7c;
      --accent: #5ebaa7;
      --danger: #e87070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr 28px;
      grid-template-columns: 300px 1fr;
      grid-template-areas:
        "top top"
        "side main"
        "status status";
    }
    header {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header .brand { color: var(--accent); font-weight: 700; font-size: 18px; }
    header .sub { color: var(--dim); font-size: 13px; }
    header .spacer { flex: 1; }
    aside {
      grid-area: side;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px 14px;
      overflow: auto;
    }
    main {
      grid-area: main;
      padding: 12px;
      min-width: 0;
      min-height: 0;
      position: relative;
    }
    #plot {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    footer {
      grid-area: status;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
    }
    .card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .section {
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-size: 11px;
      font-weight: 700;
      color: var(--dim);
      margin: 8px 0 6px;
    }
    label.row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    input[type="range"] { width: 100%; }
    select, input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }
    button, .btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      font: inherit;
    }
    button.primary, .btn.primary { background: var(--accent); color: var(--bg); }
    button.secondary { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }
    button.danger {
      background: rgba(232,112,112,0.12);
      color: var(--danger);
      border: 1px solid rgba(232,112,112,0.35);
      padding: 4px 8px;
      font-size: 12px;
    }
    .file-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .file-head .name {
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-head .rows { color: var(--dim); font-size: 12px; }
    .empty {
      position: absolute;
      inset: 12px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      pointer-events: none;
    }
    .empty[hidden] { display: none; }
    .swatch {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; background: var(--dim); flex: 0 0 auto;
    }
    .busy { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">tview</div>
    <div class="sub">web · client-side charts</div>
    <div class="spacer"></div>
    <button class="secondary" id="btn-download">Export PNG</button>
    <label class="btn primary">
      + Upload
      <input id="file-input" type="file" accept=".csv,.tsv,.txt,.tab,text/csv" multiple hidden />
    </label>
  </header>
  <aside>
    <div class="section">Display</div>
    <div class="card">
      <label>X axis
        <select id="x-col"></select>
      </label>
      <label class="row"><input type="checkbox" id="log-y" /> Log-scale Y</label>
      <label class="row"><input type="checkbox" id="live" checked /> Live reload</label>
      <label>Smoothing <span id="smooth-val">0</span>
        <input type="range" id="smooth" min="0" max="0.95" step="0.05" value="0" />
      </label>
      <label>Line width <span id="lw-val">2</span>
        <input type="range" id="lw" min="0.5" max="4" step="0.1" value="2" />
      </label>
    </div>
    <div class="section">Open by path</div>
    <div class="card">
      <input type="text" id="path-input" placeholder="/data/run.csv" />
      <div style="height:8px"></div>
      <button class="secondary" id="btn-path" style="width:100%">Load path</button>
    </div>
    <div class="section" id="files-title">Files (0)</div>
    <div id="files"></div>
  </aside>
  <main>
    <div id="plot"></div>
    <div class="empty" id="empty">Upload a CSV/TSV or load a server path to plot.</div>
  </main>
  <footer>
    <span id="meta">0 files · 0 series</span>
    <span>·</span>
    <span id="live-tag" class="busy">live</span>
    <span>·</span>
    <span id="status"></span>
  </footer>
  <script>
    const $ = (id) => document.getElementById(id);
    const PALETTE = [
      "#5ebaa7","#78aaff","#f0a060","#c88cff","#78d28c",
      "#ff8296","#ffd264","#64d2dc","#b4c8ff","#ff966e"
    ];

    let state = null;
    let lastGeneration = -1;
    let lastFilesKey = "";
    let debounceTimer = null;
    let applyingControls = false;
    let chart = echarts.init($("plot"), null, { renderer: "canvas" });

    const axisStyle = {
      axisLine: { lineStyle: { color: "#303644" } },
      axisLabel: { color: "#949cac" },
      splitLine: { lineStyle: { color: "#222630" } },
      nameTextStyle: { color: "#646c7c" },
    };

    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error((await res.text()) || res.statusText);
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return res.json();
      return res;
    }

    function scheduleOptions() {
      if (applyingControls) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(pushOptions, 80);
    }

    async function pushOptions() {
      await api("/api/options", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          x_col: $("x-col").value,
          log_y: $("log-y").checked,
          smoothing: Number($("smooth").value),
          line_w: Number($("lw").value),
        }),
      });
    }

    function filesKey(files) {
      return files.map((f) =>
        [f.name, f.path, f.nrows, f.visible, f.columns.map((c) => `${c.name}:${c.selected|0}`).join(",")].join("|")
      ).join(";");
    }

    function syncControls(s) {
      applyingControls = true;
      const xsel = $("x-col");
      const cur = s.options.x_col;
      if (xsel.dataset.opts !== s.x_axis_options.join("\0")) {
        xsel.dataset.opts = s.x_axis_options.join("\0");
        xsel.innerHTML = "";
        for (const o of s.x_axis_options) {
          const opt = document.createElement("option");
          opt.value = o;
          opt.textContent = o;
          xsel.appendChild(opt);
        }
      }
      xsel.value = cur;
      $("log-y").checked = s.options.log_y;
      $("live").checked = s.live_reload;
      $("smooth").value = s.options.smoothing;
      $("smooth-val").textContent = Number(s.options.smoothing).toFixed(2);
      $("lw").value = s.options.line_w;
      $("lw-val").textContent = Number(s.options.line_w).toFixed(1);
      applyingControls = false;
    }

    function renderFiles(s) {
      const key = filesKey(s.files);
      if (key === lastFilesKey) return;
      lastFilesKey = key;
      $("files-title").textContent = `Files (${s.files.length})`;
      const root = $("files");
      root.innerHTML = "";
      let colorIdx = 0;
      s.files.forEach((f, fi) => {
        const card = document.createElement("div");
        card.className = "card";
        const head = document.createElement("div");
        head.className = "file-head";
        const vis = document.createElement("input");
        vis.type = "checkbox";
        vis.checked = f.visible;
        vis.onchange = () => api(`/api/files/${fi}/visible`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visible: vis.checked }),
        });
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = f.name;
        name.title = f.path;
        const rows = document.createElement("div");
        rows.className = "rows";
        rows.textContent = `${f.nrows} rows`;
        const rm = document.createElement("button");
        rm.className = "danger";
        rm.textContent = "Remove";
        rm.onclick = () => api(`/api/files/${fi}`, { method: "DELETE" });
        head.append(vis, name, rows, rm);
        card.appendChild(head);
        f.columns.forEach((c, ci) => {
          if (!c.numeric) return;
          const row = document.createElement("label");
          row.className = "row";
          const sw = document.createElement("span");
          sw.className = "swatch";
          if (c.selected && f.visible && c.name !== s.options.x_col) {
            sw.style.background = PALETTE[colorIdx++ % PALETTE.length];
          }
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = c.selected;
          cb.onchange = () => api(`/api/files/${fi}/columns/${ci}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selected: cb.checked }),
          });
          row.append(sw, cb, document.createTextNode(" " + c.name));
          card.appendChild(row);
        });
        root.appendChild(card);
      });
    }

    function renderPlot(s) {
      if (!s.series.length) {
        $("empty").hidden = false;
        chart.clear();
        return;
      }
      $("empty").hidden = true;
      const lw = Number(s.options.line_w) || 2;
      chart.setOption({
        animation: false,
        backgroundColor: "transparent",
        textStyle: { color: "#949cac" },
        legend: {
          type: "scroll",
          top: 8,
          textStyle: { color: "#949cac" },
        },
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "cross" },
          backgroundColor: "rgba(26,29,36,0.92)",
          borderColor: "#303644",
          textStyle: { color: "#e8ecf2" },
        },
        grid: { left: 56, right: 24, top: 48, bottom: 48, containLabel: false },
        xAxis: {
          type: "value",
          name: s.options.x_col,
          nameLocation: "middle",
          nameGap: 28,
          scale: true,
          ...axisStyle,
        },
        yAxis: {
          type: "value",
          name: s.options.log_y ? "value (log10)" : "value",
          nameLocation: "middle",
          nameGap: 40,
          scale: true,
          ...axisStyle,
        },
        series: s.series.map((ser) => {
          const color = `rgb(${ser.color[0]},${ser.color[1]},${ser.color[2]})`;
          const main = {
            name: ser.name,
            type: "line",
            showSymbol: false,
            sampling: "lttb",
            large: true,
            largeThreshold: 800,
            data: ser.xs.map((x, i) => [x, ser.ys[i]]),
            lineStyle: { width: lw, color },
            itemStyle: { color },
            emphasis: { disabled: true },
          };
          if (!ser.raw_ys) return main;
          const faint = {
            name: ser.name + " (raw)",
            type: "line",
            showSymbol: false,
            sampling: "lttb",
            data: ser.xs.map((x, i) => [x, ser.raw_ys[i]]),
            lineStyle: { width: Math.max(1, lw * 0.55), color, opacity: 0.28 },
            itemStyle: { color },
            tooltip: { show: false },
            legendHoverLink: false,
            silent: true,
          };
          return [faint, main];
        }).flat(),
      }, { notMerge: true });
    }

    async function pullState() {
      const s = await api("/api/state");
      state = s;
      lastGeneration = s.generation;
      $("status").textContent = s.status || (s.busy ? "working…" : "");
      $("meta").textContent = `${s.files.length} files · ${s.series.length} series`;
      $("live-tag").style.display = s.live_reload && s.files.length ? "inline" : "none";
      syncControls(s);
      renderFiles(s);
      renderPlot(s);
    }

    async function tick() {
      try {
        const meta = await api("/api/meta");
        $("status").textContent = meta.status || (meta.busy ? "working…" : $("status").textContent);
        if (meta.generation !== lastGeneration) {
          await pullState();
        }
      } catch (e) {
        $("status").textContent = String(e.message || e);
      }
    }

    $("x-col").onchange = scheduleOptions;
    $("log-y").onchange = scheduleOptions;
    $("smooth").oninput = () => {
      $("smooth-val").textContent = Number($("smooth").value).toFixed(2);
      scheduleOptions();
    };
    $("lw").oninput = () => {
      $("lw-val").textContent = Number($("lw").value).toFixed(1);
      scheduleOptions();
    };
    $("live").onchange = () => {
      if (applyingControls) return;
      api("/api/live", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ live: $("live").checked }),
      });
    };

    $("btn-path").onclick = async () => {
      const path = $("path-input").value.trim();
      if (!path) return;
      await api("/api/load", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paths: [path] }),
      });
      $("path-input").value = "";
      await pullState();
    };

    $("file-input").onchange = async (e) => {
      const files = [...e.target.files];
      for (const file of files) {
        const fd = new FormData();
        fd.append("file", file, file.name);
        await api("/api/upload", { method: "POST", body: fd });
      }
      e.target.value = "";
      await pullState();
    };

    $("btn-download").onclick = () => {
      const a = document.createElement("a");
      a.href = `/api/plot.png?t=${Date.now()}`;
      a.download = "plot.png";
      a.click();
    };

    new ResizeObserver(() => chart.resize()).observe($("plot"));
    pullState();
    setInterval(tick, 250);
  </script>
</body>
</html>
