<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tview</title>
  <style>
    :root {
      --bg: #121418;
      --panel: #1a1d24;
      --elevated: #222630;
      --border: #303644;
      --text: #e8ecf2;
      --muted: #949cac;
      --dim: #646c7c;
      --accent: #5ebaa7;
      --danger: #e87070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr 28px;
      grid-template-columns: 300px 1fr;
      grid-template-areas:
        "top top"
        "side main"
        "status status";
    }
    header {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header .brand { color: var(--accent); font-weight: 700; font-size: 18px; }
    header .sub { color: var(--dim); font-size: 13px; }
    header .spacer { flex: 1; }
    aside {
      grid-area: side;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px 14px;
      overflow: auto;
    }
    main {
      grid-area: main;
      padding: 12px;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    footer {
      grid-area: status;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
    }
    .card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .section {
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-size: 11px;
      font-weight: 700;
      color: var(--dim);
      margin: 8px 0 6px;
    }
    label.row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    input[type="range"] { width: 100%; }
    select, input[type="text"], input[type="file"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: var(--accent); color: var(--bg); }
    button.secondary { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }
    button.danger {
      background: rgba(232,112,112,0.12);
      color: var(--danger);
      border: 1px solid rgba(232,112,112,0.35);
      padding: 4px 8px;
      font-size: 12px;
    }
    .file-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .file-head .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-head .rows { color: var(--dim); font-size: 12px; }
    #plot {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
    }
    .swatch {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; background: var(--dim);
    }
    .busy { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">tview</div>
    <div class="sub">web · CSV / TSV metrics viewer</div>
    <div class="spacer"></div>
    <button class="secondary" id="btn-download">Export PNG</button>
    <label class="primary" style="display:inline-block;padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--bg);font-weight:600;cursor:pointer;">
      + Upload
      <input id="file-input" type="file" accept=".csv,.tsv,.txt,.tab,text/csv" multiple hidden />
    </label>
  </header>
  <aside>
    <div class="section">Display</div>
    <div class="card">
      <label>X axis
        <select id="x-col"></select>
      </label>
      <label class="row"><input type="checkbox" id="log-y" /> Log-scale Y</label>
      <label class="row"><input type="checkbox" id="live" checked /> Live reload</label>
      <label>Smoothing <span id="smooth-val">0</span>
        <input type="range" id="smooth" min="0" max="0.95" step="0.05" value="0" />
      </label>
      <label>Line width <span id="lw-val">2</span>
        <input type="range" id="lw" min="0.5" max="4" step="0.1" value="2" />
      </label>
    </div>
    <div class="section">Open by path</div>
    <div class="card">
      <input type="text" id="path-input" placeholder="/data/run.csv" />
      <div style="height:8px"></div>
      <button class="secondary" id="btn-path" style="width:100%">Load path</button>
    </div>
    <div class="section" id="files-title">Files (0)</div>
    <div id="files"></div>
  </aside>
  <main>
    <img id="plot" alt="plot" hidden />
    <div class="empty" id="empty">Upload a CSV/TSV or load a server path to plot.</div>
  </main>
  <footer>
    <span id="meta">0 files · 0 series</span>
    <span>·</span>
    <span id="live-tag" class="busy">live</span>
    <span>·</span>
    <span id="status"></span>
  </footer>
  <script>
    const $ = (id) => document.getElementById(id);
    let state = null;
    let debounceTimer = null;

    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || res.statusText);
      }
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return res.json();
      return res;
    }

    function scheduleOptions() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(pushOptions, 120);
    }

    async function pushOptions() {
      await api("/api/options", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          x_col: $("x-col").value,
          log_y: $("log-y").checked,
          smoothing: Number($("smooth").value),
          line_w: Number($("lw").value),
        }),
      });
    }

    async function refresh() {
      state = await api("/api/state");
      $("status").textContent = state.status || "";
      $("meta").textContent = `${state.files.length} files · ${state.series.length} series`;
      $("live-tag").style.display = state.live_reload && state.files.length ? "inline" : "none";
      $("files-title").textContent = `Files (${state.files.length})`;

      const xsel = $("x-col");
      const cur = state.options.x_col;
      xsel.innerHTML = "";
      for (const o of state.x_axis_options) {
        const opt = document.createElement("option");
        opt.value = o; opt.textContent = o;
        if (o === cur) opt.selected = true;
        xsel.appendChild(opt);
      }
      $("log-y").checked = state.options.log_y;
      $("live").checked = state.live_reload;
      $("smooth").value = state.options.smoothing;
      $("smooth-val").textContent = Number(state.options.smoothing).toFixed(2);
      $("lw").value = state.options.line_w;
      $("lw-val").textContent = Number(state.options.line_w).toFixed(1);

      const files = $("files");
      files.innerHTML = "";
      let colorIdx = 0;
      const palette = [
        "#5ebaa7","#78aaff","#f0a060","#c88cff","#78d28c",
        "#ff8296","#ffd264","#64d2dc","#b4c8ff","#ff966e"
      ];
      state.files.forEach((f, fi) => {
        const card = document.createElement("div");
        card.className = "card";
        const head = document.createElement("div");
        head.className = "file-head";
        const vis = document.createElement("input");
        vis.type = "checkbox"; vis.checked = f.visible;
        vis.onchange = () => api(`/api/files/${fi}/visible`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visible: vis.checked }),
        });
        const name = document.createElement("div");
        name.className = "name"; name.textContent = f.name; name.title = f.path;
        const rows = document.createElement("div");
        rows.className = "rows"; rows.textContent = `${f.nrows} rows`;
        const rm = document.createElement("button");
        rm.className = "danger"; rm.textContent = "Remove";
        rm.onclick = () => api(`/api/files/${fi}`, { method: "DELETE" });
        head.append(vis, name, rows, rm);
        card.appendChild(head);
        f.columns.forEach((c, ci) => {
          if (!c.numeric) return;
          const row = document.createElement("label");
          row.className = "row";
          const sw = document.createElement("span");
          sw.className = "swatch";
          if (c.selected && f.visible && c.name !== state.options.x_col) {
            sw.style.background = palette[colorIdx++ % palette.length];
          }
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = c.selected;
          cb.onchange = () => api(`/api/files/${fi}/columns/${ci}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selected: cb.checked }),
          });
          row.append(sw, cb, document.createTextNode(c.name));
          card.appendChild(row);
        });
        files.appendChild(card);
      });

      if (state.series.length === 0) {
        $("plot").hidden = true;
        $("empty").hidden = false;
      } else {
        $("empty").hidden = true;
        $("plot").hidden = false;
        $("plot").src = `/api/plot.png?g=${state.generation}&t=${Date.now()}`;
      }
    }

    $("x-col").onchange = scheduleOptions;
    $("log-y").onchange = scheduleOptions;
    $("smooth").oninput = () => {
      $("smooth-val").textContent = Number($("smooth").value).toFixed(2);
      scheduleOptions();
    };
    $("lw").oninput = () => {
      $("lw-val").textContent = Number($("lw").value).toFixed(1);
      scheduleOptions();
    };
    $("live").onchange = () => api("/api/live", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ live: $("live").checked }),
    });

    $("btn-path").onclick = async () => {
      const path = $("path-input").value.trim();
      if (!path) return;
      await api("/api/load", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paths: [path] }),
      });
      $("path-input").value = "";
    };

    $("file-input").onchange = async (e) => {
      const files = [...e.target.files];
      for (const file of files) {
        const fd = new FormData();
        fd.append("file", file, file.name);
        await api("/api/upload", { method: "POST", body: fd });
      }
      e.target.value = "";
    };

    $("btn-download").onclick = () => {
      const a = document.createElement("a");
      a.href = `/api/plot.png?download=1&t=${Date.now()}`;
      a.download = "plot.png";
      a.click();
    };

    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
