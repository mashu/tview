<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tview</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #121418;
      --panel: #1a1d24;
      --elevated: #222630;
      --border: #303644;
      --text: #e8ecf2;
      --muted: #949cac;
      --dim: #646c7c;
      --accent: #5ebaa7;
      --danger: #e87070;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr 28px;
      grid-template-columns: 300px 1fr;
      grid-template-areas:
        "top top"
        "side main"
        "status status";
    }
    header {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header .brand { color: var(--accent); font-weight: 700; font-size: 18px; }
    header .sub { color: var(--dim); font-size: 13px; }
    header .spacer { flex: 1; }
    aside {
      grid-area: side;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px 14px;
      overflow: auto;
    }
    main {
      grid-area: main;
      padding: 12px;
      min-width: 0;
      min-height: 0;
      position: relative;
    }
    #plot {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    footer {
      grid-area: status;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
    }
    .card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .section {
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-size: 11px;
      font-weight: 700;
      color: var(--dim);
      margin: 8px 0 6px;
    }
    label.row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    input[type="range"] { width: 100%; }
    select, input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }
    button, .btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      font: inherit;
    }
    button.primary, .btn.primary { background: var(--accent); color: var(--bg); }
    button.secondary { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }
    button.danger {
      background: rgba(232,112,112,0.12);
      color: var(--danger);
      border: 1px solid rgba(232,112,112,0.35);
      padding: 4px 8px;
      font-size: 12px;
    }
    .file-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .file-head .name {
      font-weight: 600;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-head .rows { color: var(--dim); font-size: 12px; }
    .empty {
      position: absolute;
      inset: 12px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      pointer-events: none;
    }
    .empty[hidden] { display: none; }
    .swatch {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; background: var(--dim); flex: 0 0 auto;
    }
    .busy { color: var(--accent); }
    .trend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .trend-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--elevated);
      font-size: 11px;
      color: var(--muted);
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trend-chip .dot {
      width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
    }
    .trend-chip.decreasing { color: #8fd6c6; border-color: rgba(94,186,167,0.45); }
    .trend-chip.plateau { color: #e6d08a; border-color: rgba(255,210,100,0.4); }
    .trend-chip.increasing { color: #a8c4ff; border-color: rgba(120,170,255,0.45); }
  </style>
</head>
<body>
  <header>
    <div class="brand">tview</div>
    <div class="sub">web · client-side charts</div>
    <div class="spacer"></div>
    <button class="secondary" id="btn-download">Export PNG</button>
    <label class="btn primary">
      + Upload
      <input id="file-input" type="file" accept=".csv,.tsv,.txt,.tab,text/csv" multiple hidden />
    </label>
  </header>
  <aside>
    <div class="section">Display</div>
    <div class="card">
      <label>X axis
        <select id="x-col"></select>
      </label>
      <label class="row"><input type="checkbox" id="log-y" /> Log-scale Y</label>
      <label class="row"><input type="checkbox" id="live" checked /> Live reload</label>
      <label>Smoothing <span id="smooth-val">0</span>
        <input type="range" id="smooth" min="0" max="0.95" step="0.05" value="0" />
      </label>
      <label>Line width <span id="lw-val">2</span>
        <input type="range" id="lw" min="0.5" max="4" step="0.1" value="2" />
      </label>
      <label class="row"><input type="checkbox" id="slope" checked /> Slope on hover</label>
      <label>Slope window <span id="slope-win-val">12</span> pts
        <input type="range" id="slope-win" min="3" max="60" step="1" value="12" />
      </label>
      <label>Plateau band <span id="plateau-val">2</span>%
        <input type="range" id="plateau" min="0.5" max="10" step="0.5" value="2" />
      </label>
    </div>
    <div class="section">Open by path</div>
    <div class="card">
      <input type="text" id="path-input" placeholder="/data/run.csv" />
      <div style="height:8px"></div>
      <button class="secondary" id="btn-path" style="width:100%">Load path</button>
    </div>
    <div class="section" id="files-title">Files (0)</div>
    <div id="files"></div>
  </aside>
  <main>
    <div id="plot"></div>
    <div class="empty" id="empty">Upload a CSV/TSV or load a server path to plot.</div>
  </main>
  <footer>
    <span id="meta">0 files · 0 series</span>
    <span>·</span>
    <span id="live-tag" class="busy">live</span>
    <span>·</span>
    <span id="end-trend" class="trend" title="Trend over the last slope-window points at the end of each series"></span>
    <span>·</span>
    <span id="status"></span>
  </footer>
  <script>
    const $ = (id) => document.getElementById(id);
    const PALETTE = [
      "#5ebaa7","#78aaff","#f0a060","#c88cff","#78d28c",
      "#ff8296","#ffd264","#64d2dc","#b4c8ff","#ff966e"
    ];

    let state = null;
    let lastGeneration = -1;
    let lastFilesKey = "";
    let debounceTimer = null;
    let applyingControls = false;
    let chart = echarts.init($("plot"), null, { renderer: "canvas" });
    let hoverX = null;

    const axisStyle = {
      axisLine: { lineStyle: { color: "#303644" } },
      axisLabel: { color: "#949cac" },
      splitLine: { lineStyle: { color: "#222630" } },
      nameTextStyle: { color: "#646c7c" },
    };

    function slopeWindow() {
      return Math.max(3, Math.round(Number($("slope-win").value) || 12));
    }

    function plateauFrac() {
      return Math.max(0.001, (Number($("plateau").value) || 2) / 100);
    }

    function slopeEnabled() {
      return $("slope").checked;
    }

    function fmtNum(v) {
      if (!Number.isFinite(v)) return "—";
      const a = Math.abs(v);
      if (a !== 0 && (a >= 1e4 || a < 1e-3)) return v.toExponential(2);
      return String(Number(v.toPrecision(4)));
    }

    function nearestIndex(xs, x) {
      if (!xs.length) return -1;
      let lo = 0, hi = xs.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (xs[mid] < x) lo = mid + 1;
        else hi = mid;
      }
      if (lo > 0 && Math.abs(xs[lo - 1] - x) <= Math.abs(xs[lo] - x)) return lo - 1;
      return lo;
    }

    /** OLS fit on the trailing window ending at endIdx. */
    function localSlope(xs, ys, endIdx, window, plateau) {
      const end = Math.min(endIdx, xs.length - 1);
      if (end < 0) return null;
      const start = Math.max(0, end - window + 1);
      let n = 0, sumX = 0, sumY = 0, sumXX = 0, sumXY = 0;
      let xFirst = NaN, xLast = NaN;
      for (let i = start; i <= end; i++) {
        const x = xs[i], y = ys[i];
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        if (!Number.isFinite(xFirst)) xFirst = x;
        xLast = x;
        n += 1;
        sumX += x;
        sumY += y;
        sumXX += x * x;
        sumXY += x * y;
      }
      if (n < 2) return null;
      const denom = n * sumXX - sumX * sumX;
      if (Math.abs(denom) < 1e-18) return null;
      const slope = (n * sumXY - sumX * sumY) / denom;
      const meanX = sumX / n;
      const meanY = sumY / n;
      const intercept = meanY - slope * meanX;
      const xSpan = xLast - xFirst;
      const dy = slope * xSpan;
      const scale = Math.max(Math.abs(meanY), 1e-12);
      const rel = dy / scale;
      let trend = "plateau";
      if (rel < -plateau) trend = "decreasing";
      else if (rel > plateau) trend = "increasing";
      const x0 = xs[end];
      const y0 = intercept + slope * x0;
      return { slope, intercept, meanX, meanY, start, end, n, xSpan, rel, trend, x0, y0, xFirst, xLast };
    }

    function trendText(trend) {
      if (trend === "decreasing") return "decreasing";
      if (trend === "increasing") return "increasing";
      return "plateau";
    }

    function trendArrow(trend) {
      if (trend === "decreasing") return "↓";
      if (trend === "increasing") return "↑";
      return "→";
    }

    function trendColor(trend) {
      if (trend === "decreasing") return "#5ebaa7";
      if (trend === "increasing") return "#78aaff";
      return "#ffd264";
    }

    function clearTangents() {
      chart.setOption({ graphic: [] }, { lazyUpdate: true });
    }

    function drawTangents(x) {
      if (!slopeEnabled() || !state?.series?.length || !Number.isFinite(x)) {
        clearTangents();
        return;
      }
      const win = slopeWindow();
      const plateau = plateauFrac();
      const graphics = [];
      for (const ser of state.series) {
        const idx = nearestIndex(ser.xs, x);
        const fit = localSlope(ser.xs, ser.ys, idx, win, plateau);
        if (!fit || !Number.isFinite(fit.y0)) continue;
        const halfSpan = Math.abs(fit.xSpan);
        let half = halfSpan > 0 ? halfSpan * 0.6 : 0;
        if (!(half > 0)) {
          const full = Math.abs(ser.xs[ser.xs.length - 1] - ser.xs[0]);
          half = Math.max(full * 0.03, Number.isFinite(full) ? full || 1 : 1);
        }
        const x1 = fit.x0 - half;
        const x2 = fit.x0 + half;
        const y1 = fit.intercept + fit.slope * x1;
        const y2 = fit.intercept + fit.slope * x2;
        const p1 = chart.convertToPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [x1, y1]);
        const p2 = chart.convertToPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [x2, y2]);
        const pc = chart.convertToPixel({ xAxisIndex: 0, yAxisIndex: 0 }, [fit.x0, fit.y0]);
        if (!p1 || !p2 || !pc) continue;
        const color = `rgb(${ser.color[0]},${ser.color[1]},${ser.color[2]})`;
        graphics.push({
          type: "line",
          shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] },
          style: {
            stroke: color,
            lineWidth: 1.6,
            lineDash: [5, 4],
            opacity: 0.9,
          },
          silent: true,
          z: 100,
        });
        graphics.push({
          type: "circle",
          shape: { cx: pc[0], cy: pc[1], r: 3.2 },
          style: { fill: color, stroke: "#121418", lineWidth: 1 },
          silent: true,
          z: 101,
        });
      }
      chart.setOption({ graphic: graphics }, { lazyUpdate: true });
    }

    function renderEndTrend(s) {
      const root = $("end-trend");
      root.innerHTML = "";
      if (!slopeEnabled() || !s.series.length) return;
      const win = slopeWindow();
      const plateau = plateauFrac();
      for (const ser of s.series) {
        const fit = localSlope(ser.xs, ser.ys, ser.xs.length - 1, win, plateau);
        if (!fit) continue;
        const chip = document.createElement("span");
        chip.className = `trend-chip ${fit.trend}`;
        const short = ser.name.length > 28 ? ser.name.slice(0, 26) + "…" : ser.name;
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = `rgb(${ser.color[0]},${ser.color[1]},${ser.color[2]})`;
        chip.append(
          dot,
          document.createTextNode(
            `${short} ${trendArrow(fit.trend)} ${trendText(fit.trend)} (${(fit.rel * 100).toFixed(1)}%)`
          )
        );
        chip.title = `${ser.name}: end-window slope ${fmtNum(fit.slope)} · relative Δ ${(fit.rel * 100).toFixed(2)}% over last ${fit.n} pts`;
        root.appendChild(chip);
      }
    }

    function slopeTooltipHtml(params) {
      if (!params?.length) return "";
      const x = params[0].axisValue;
      const win = slopeWindow();
      const plateau = plateauFrac();
      let html = `<div style="margin-bottom:4px;color:#949cac">x = ${fmtNum(x)}</div>`;
      for (const p of params) {
        if (!p || String(p.seriesName).endsWith("(raw)")) continue;
        const ser = state?.series?.find((s) => s.name === p.seriesName);
        const y = Array.isArray(p.value) ? p.value[1] : p.value;
        html += `<div style="margin:3px 0">${p.marker} <b>${p.seriesName}</b>: ${fmtNum(y)}`;
        if (slopeEnabled() && ser) {
          const idx = nearestIndex(ser.xs, x);
          const fit = localSlope(ser.xs, ser.ys, idx, win, plateau);
          if (fit) {
            const col = trendColor(fit.trend);
            html += `<div style="margin:2px 0 2px 18px;color:${col};font-size:12px">`
              + `${trendArrow(fit.trend)} ${trendText(fit.trend)}`
              + ` · slope ${fmtNum(fit.slope)}`
              + ` · Δ ${(fit.rel * 100).toFixed(1)}% / ${fit.n} pts`
              + `</div>`;
          }
        }
        html += `</div>`;
      }
      return html;
    }

    async function api(path, opts) {
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error((await res.text()) || res.statusText);
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return res.json();
      return res;
    }

    function scheduleOptions() {
      if (applyingControls) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(pushOptions, 80);
    }

    async function pushOptions() {
      await api("/api/options", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          x_col: $("x-col").value,
          log_y: $("log-y").checked,
          smoothing: Number($("smooth").value),
          line_w: Number($("lw").value),
        }),
      });
    }

    function filesKey(files) {
      return files.map((f) =>
        [f.name, f.path, f.nrows, f.visible, f.columns.map((c) => `${c.name}:${c.selected|0}`).join(",")].join("|")
      ).join(";");
    }

    function syncControls(s) {
      applyingControls = true;
      const xsel = $("x-col");
      const cur = s.options.x_col;
      if (xsel.dataset.opts !== s.x_axis_options.join("\0")) {
        xsel.dataset.opts = s.x_axis_options.join("\0");
        xsel.innerHTML = "";
        for (const o of s.x_axis_options) {
          const opt = document.createElement("option");
          opt.value = o;
          opt.textContent = o;
          xsel.appendChild(opt);
        }
      }
      xsel.value = cur;
      $("log-y").checked = s.options.log_y;
      $("live").checked = s.live_reload;
      $("smooth").value = s.options.smoothing;
      $("smooth-val").textContent = Number(s.options.smoothing).toFixed(2);
      $("lw").value = s.options.line_w;
      $("lw-val").textContent = Number(s.options.line_w).toFixed(1);
      applyingControls = false;
    }

    function renderFiles(s) {
      const key = filesKey(s.files);
      if (key === lastFilesKey) return;
      lastFilesKey = key;
      $("files-title").textContent = `Files (${s.files.length})`;
      const root = $("files");
      root.innerHTML = "";
      let colorIdx = 0;
      s.files.forEach((f, fi) => {
        const card = document.createElement("div");
        card.className = "card";
        const head = document.createElement("div");
        head.className = "file-head";
        const vis = document.createElement("input");
        vis.type = "checkbox";
        vis.checked = f.visible;
        vis.onchange = () => api(`/api/files/${fi}/visible`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visible: vis.checked }),
        });
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = f.name;
        name.title = f.path;
        const rows = document.createElement("div");
        rows.className = "rows";
        rows.textContent = `${f.nrows} rows`;
        const rm = document.createElement("button");
        rm.className = "danger";
        rm.textContent = "Remove";
        rm.onclick = () => api(`/api/files/${fi}`, { method: "DELETE" });
        head.append(vis, name, rows, rm);
        card.appendChild(head);
        f.columns.forEach((c, ci) => {
          if (!c.numeric) return;
          const row = document.createElement("label");
          row.className = "row";
          const sw = document.createElement("span");
          sw.className = "swatch";
          if (c.selected && f.visible && c.name !== s.options.x_col) {
            sw.style.background = PALETTE[colorIdx++ % PALETTE.length];
          }
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = c.selected;
          cb.onchange = () => api(`/api/files/${fi}/columns/${ci}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ selected: cb.checked }),
          });
          row.append(sw, cb, document.createTextNode(" " + c.name));
          card.appendChild(row);
        });
        root.appendChild(card);
      });
    }

    function renderPlot(s) {
      if (!s.series.length) {
        $("empty").hidden = false;
        chart.clear();
        hoverX = null;
        renderEndTrend(s);
        return;
      }
      $("empty").hidden = true;
      const lw = Number(s.options.line_w) || 2;
      chart.setOption({
        animation: false,
        backgroundColor: "transparent",
        textStyle: { color: "#949cac" },
        legend: {
          type: "scroll",
          top: 8,
          textStyle: { color: "#949cac" },
        },
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "cross" },
          backgroundColor: "rgba(26,29,36,0.92)",
          borderColor: "#303644",
          textStyle: { color: "#e8ecf2" },
          formatter: slopeTooltipHtml,
        },
        grid: { left: 56, right: 24, top: 48, bottom: 48, containLabel: false },
        xAxis: {
          type: "value",
          name: s.options.x_col,
          nameLocation: "middle",
          nameGap: 28,
          scale: true,
          ...axisStyle,
        },
        yAxis: {
          type: "value",
          name: s.options.log_y ? "value (log10)" : "value",
          nameLocation: "middle",
          nameGap: 40,
          scale: true,
          ...axisStyle,
        },
        graphic: [],
        series: s.series.map((ser) => {
          const color = `rgb(${ser.color[0]},${ser.color[1]},${ser.color[2]})`;
          const main = {
            name: ser.name,
            type: "line",
            showSymbol: false,
            sampling: "lttb",
            large: true,
            largeThreshold: 800,
            data: ser.xs.map((x, i) => [x, ser.ys[i]]),
            lineStyle: { width: lw, color },
            itemStyle: { color },
            emphasis: { disabled: true },
          };
          if (!ser.raw_ys) return main;
          const faint = {
            name: ser.name + " (raw)",
            type: "line",
            showSymbol: false,
            sampling: "lttb",
            data: ser.xs.map((x, i) => [x, ser.raw_ys[i]]),
            lineStyle: { width: Math.max(1, lw * 0.55), color, opacity: 0.28 },
            itemStyle: { color },
            tooltip: { show: false },
            legendHoverLink: false,
            silent: true,
          };
          return [faint, main];
        }).flat(),
      }, { notMerge: true });
      renderEndTrend(s);
      if (hoverX != null) drawTangents(hoverX);
    }

    async function pullState() {
      const s = await api("/api/state");
      state = s;
      lastGeneration = s.generation;
      $("status").textContent = s.status || (s.busy ? "working…" : "");
      $("meta").textContent = `${s.files.length} files · ${s.series.length} series`;
      $("live-tag").style.display = s.live_reload && s.files.length ? "inline" : "none";
      syncControls(s);
      renderFiles(s);
      renderPlot(s);
    }

    async function tick() {
      try {
        const meta = await api("/api/meta");
        $("status").textContent = meta.status || (meta.busy ? "working…" : $("status").textContent);
        if (meta.generation !== lastGeneration) {
          await pullState();
        }
      } catch (e) {
        $("status").textContent = String(e.message || e);
      }
    }

    $("x-col").onchange = scheduleOptions;
    $("log-y").onchange = scheduleOptions;
    $("smooth").oninput = () => {
      $("smooth-val").textContent = Number($("smooth").value).toFixed(2);
      scheduleOptions();
    };
    $("lw").oninput = () => {
      $("lw-val").textContent = Number($("lw").value).toFixed(1);
      scheduleOptions();
    };
    function refreshSlopeUi() {
      $("slope-win-val").textContent = String(slopeWindow());
      $("plateau-val").textContent = String(Number($("plateau").value) || 2);
      if (state) renderEndTrend(state);
      if (hoverX != null) drawTangents(hoverX);
      else clearTangents();
    }
    $("slope").onchange = refreshSlopeUi;
    $("slope-win").oninput = refreshSlopeUi;
    $("plateau").oninput = refreshSlopeUi;

    chart.on("updateAxisPointer", (ev) => {
      const xInfo = (ev.axesInfo || []).find((a) => a.axisDim === "x");
      if (!xInfo || !Number.isFinite(xInfo.value)) {
        hoverX = null;
        clearTangents();
        return;
      }
      hoverX = xInfo.value;
      drawTangents(hoverX);
    });
    chart.getZr().on("globalout", () => {
      hoverX = null;
      clearTangents();
    });

    $("live").onchange = () => {
      if (applyingControls) return;
      api("/api/live", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ live: $("live").checked }),
      });
    };

    $("btn-path").onclick = async () => {
      const path = $("path-input").value.trim();
      if (!path) return;
      await api("/api/load", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paths: [path] }),
      });
      $("path-input").value = "";
      await pullState();
    };

    $("file-input").onchange = async (e) => {
      const files = [...e.target.files];
      for (const file of files) {
        const fd = new FormData();
        fd.append("file", file, file.name);
        await api("/api/upload", { method: "POST", body: fd });
      }
      e.target.value = "";
      await pullState();
    };

    $("btn-download").onclick = () => {
      const a = document.createElement("a");
      a.href = `/api/plot.png?t=${Date.now()}`;
      a.download = "plot.png";
      a.click();
    };

    new ResizeObserver(() => {
      chart.resize();
      if (hoverX != null) drawTangents(hoverX);
    }).observe($("plot"));
    refreshSlopeUi();
    pullState();
    setInterval(tick, 250);
  </script>
</body>
</html>
